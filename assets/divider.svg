<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 12" width="820" height="12" role="img" aria-label="divider">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353" stop-opacity="0"/>
      <stop offset=".45" stop-color="#39d353" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#56d4dd" stop-opacity=".95"/>
      <stop offset="1" stop-color="#56d4dd" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .pulse{animation:run 5s cubic-bezier(.45,0,.55,1) infinite}
    @keyframes run{0%{transform:translateX(-220px)}100%{transform:translateX(820px)}}
    .tick{animation:fade 5s linear infinite}
    @keyframes fade{0%,100%{opacity:.25}50%{opacity:.75}}
    @media (prefers-reduced-motion:reduce){.pulse,.tick{animation:none}}
  </style>
  <line class="tick" x1="0" y1="6" x2="820" y2="6" stroke="#243140" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect class="pulse" x="0" y="4.5" width="220" height="3" rx="1.5" fill="url(#p)"/>
</svg>
